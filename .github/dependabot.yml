# Updates are proposals. Review and passing CI are required; no auto-merge.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: pip
  directory: /plugins/videomontazhka/skills/videomontazhka
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
