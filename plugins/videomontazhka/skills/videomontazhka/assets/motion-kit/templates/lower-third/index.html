<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="./motion-kit.css">
    <style>
      #lower-third .lower-safe { align-items: flex-end; }
      #lower-third .lower-card {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr);
        width: min(780px, 72%);
        min-height: 122px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        background: rgba(18, 18, 18, 0.94);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.48);
      }
      #lower-third .rail { background: var(--sprut-accent); }
      #lower-third .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 9px;
        min-width: 0;
        padding: 24px 32px 25px;
      }
      #lower-third .primary {
        color: var(--sprut-primary);
        font-size: clamp(34px, 3vw, 56px);
        line-height: 1.04;
        overflow-wrap: anywhere;
      }
      #lower-third .secondary {
        color: var(--sprut-secondary);
        font-size: clamp(20px, 1.7vw, 30px);
        line-height: 1.2;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
    </style>
    <script src="./config.js"></script>
    <script src="./vendor/gsap.min.js"></script>
    <script src="./sprut-motion-runtime.js"></script>
  </head>
  <body>
    <div id="lower-third" class="sprut-stage" data-composition-id="lower-third" data-start="0" data-duration="4" data-track-index="0" data-width="1920" data-height="1080">
      <div class="sprut-safe lower-safe">
        <div id="lower-card" class="lower-card">
          <div id="lower-rail" class="rail"></div>
          <div class="copy">
            <div id="lower-primary" class="primary sprut-display" data-sprut-line="0"></div>
            <div id="lower-secondary" class="secondary sprut-body" data-sprut-line="1"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      var state = window.SPRUTMotion.prepare("lower-third");
      var tl = window.gsap.timeline({paused: true});
      tl.from("#lower-card", {x: -130, opacity: 0, duration: 0.58, ease: "expo.out"}, 0.2);
      tl.from("#lower-rail", {scaleY: 0, transformOrigin: "center bottom", duration: 0.38, ease: "power3.out"}, 0.25);
      tl.from("#lower-primary", {y: 28, opacity: 0, duration: 0.42, ease: "power2.out"}, 0.34);
      tl.from("#lower-secondary", {y: 20, opacity: 0, duration: 0.4, ease: "sine.out"}, 0.46);
      tl.to("#lower-card", {x: -90, opacity: 0, duration: 0.34, ease: "power2.in"}, window.SPRUTMotion.finalExitAt(state.duration, 0.34));
      window.SPRUTMotion.register("lower-third", tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["lower-third"] = tl;
    </script>
  </body>
</html>
