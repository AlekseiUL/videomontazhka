<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="./motion-kit.css">
    <style>
      #kinetic-keyword .keyword-shell {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      }
      #kinetic-keyword .keyword-wrap {
        position: relative;
        display: flex;
        align-items: center;
        max-width: 88%;
        min-height: 180px;
      }
      #kinetic-keyword .accent {
        width: 14px;
        min-height: 150px;
        margin-right: 34px;
        border-radius: 8px;
        background: var(--sprut-accent);
        transform-origin: center bottom;
      }
      #kinetic-keyword .keyword {
        max-width: 1420px;
        color: var(--sprut-primary);
        font-size: clamp(72px, 7.5vw, 150px);
        line-height: 0.98;
        overflow-wrap: anywhere;
        text-shadow: 0 12px 42px rgba(0, 0, 0, 0.68);
      }
    </style>
    <script src="./config.js"></script>
    <script src="./vendor/gsap.min.js"></script>
    <script src="./sprut-motion-runtime.js"></script>
  </head>
  <body>
    <div id="kinetic-keyword" class="sprut-stage" data-composition-id="kinetic-keyword" data-start="0" data-duration="2.4" data-track-index="0" data-width="1920" data-height="1080">
      <div class="keyword-shell">
        <div class="keyword-wrap">
          <div id="keyword-accent" class="accent"></div>
          <div id="keyword-text" class="keyword sprut-display" data-sprut-approved-text></div>
        </div>
      </div>
    </div>
    <script>
      var state = window.SPRUTMotion.prepare("kinetic-keyword");
      var tl = window.gsap.timeline({paused: true});
      tl.from("#keyword-accent", {scaleY: 0, opacity: 0, duration: 0.42, ease: "power3.out"}, 0.18);
      tl.from("#keyword-text", {y: 74, scale: 0.96, opacity: 0, duration: 0.62, ease: "expo.out"}, 0.24);
      tl.to("#keyword-text", {y: -18, opacity: 0, duration: 0.28, ease: "power2.in"}, window.SPRUTMotion.finalExitAt(state.duration, 0.28));
      tl.to("#keyword-accent", {scaleY: 0, opacity: 0, duration: 0.24, ease: "power2.in"}, window.SPRUTMotion.finalExitAt(state.duration, 0.24));
      window.SPRUTMotion.register("kinetic-keyword", tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["kinetic-keyword"] = tl;
    </script>
  </body>
</html>
