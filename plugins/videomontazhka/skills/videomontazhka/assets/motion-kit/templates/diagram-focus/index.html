<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="./motion-kit.css">
    <style>
      #diagram-focus .focus-group {
        position: absolute;
        left: calc(var(--focus-x) * 100%); top: calc(var(--focus-y) * 100%);
        width: calc(var(--focus-width) * 100%); height: calc(var(--focus-height) * 100%);
      }
      #diagram-focus .focus-box {
        position: absolute; inset: 0; border: 5px solid var(--sprut-primary); border-radius: 18px;
        box-shadow: 0 0 0 5px rgba(255, 106, 0, 0.95), 0 16px 50px rgba(0, 0, 0, 0.4);
      }
      #diagram-focus .corner {
        position: absolute; top: -12px; right: -12px; width: 32px; height: 32px;
        border: 6px solid var(--sprut-primary); border-radius: 50%; background: var(--sprut-accent);
      }
      #diagram-focus .focus-label {
        position: absolute; left: 0; bottom: -82px; max-width: 620px; padding: 14px 20px;
        border-radius: 12px; background: var(--sprut-panel); color: var(--sprut-primary);
        font-size: clamp(22px, 1.8vw, 34px); line-height: 1.15; overflow-wrap: anywhere;
      }
    </style>
    <script src="./config.js"></script>
    <script src="./vendor/gsap.min.js"></script>
    <script src="./sprut-motion-runtime.js"></script>
  </head>
  <body>
    <div id="diagram-focus" class="sprut-stage" data-composition-id="diagram-focus" data-start="0" data-duration="3.4" data-track-index="0" data-width="1920" data-height="1080">
      <div id="focus-group" class="focus-group">
        <div id="focus-box" class="focus-box"></div>
        <div id="focus-corner" class="corner"></div>
        <div id="focus-label" class="focus-label sprut-body" data-sprut-approved-text></div>
      </div>
    </div>
    <script>
      var state = window.SPRUTMotion.prepare("diagram-focus");
      state.root.style.setProperty("--focus-x", String(state.config.layout.focus_x));
      state.root.style.setProperty("--focus-y", String(state.config.layout.focus_y));
      state.root.style.setProperty("--focus-width", String(state.config.layout.focus_width));
      state.root.style.setProperty("--focus-height", String(state.config.layout.focus_height));
      var tl = window.gsap.timeline({paused: true});
      tl.from("#focus-box", {scale: 0.94, opacity: 0, duration: 0.46, ease: "power3.out"}, 0.2);
      tl.from("#focus-corner", {scale: 0, opacity: 0, duration: 0.34, ease: "back.out(1.6)"}, 0.34);
      tl.from("#focus-label", {y: 22, opacity: 0, duration: 0.4, ease: "sine.out"}, 0.44);
      tl.to("#focus-group", {opacity: 0, duration: 0.28, ease: "power2.in"}, window.SPRUTMotion.finalExitAt(state.duration, 0.28));
      window.SPRUTMotion.register("diagram-focus", tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["diagram-focus"] = tl;
    </script>
  </body>
</html>
